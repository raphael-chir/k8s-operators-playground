---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-storage
spec:
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://minio.object-storage.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: minio-secret
        key: MINIO_ACCESS_KEY
      secretAccessKey:
        name: minio-secret
        key: MINIO_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-bookworm

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-storage

  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  replicationSlots:
    highAvailability:
      enabled: true

  bootstrap:
    pg_basebackup:
      source: cluster-1

  externalClusters:
    - name: cluster-1
      connectionParameters:
        host: PRIMARY_NODE_IP
        port: "30432"
        user: streaming_replica
        sslmode: verify-ca
      sslKey:
        name: cnpg-cluster-replication
        key: tls.key
      sslCert:
        name: cnpg-cluster-replication
        key: tls.crt
      sslRootCert:
        name: cnpg-cluster-ca
        key: ca.crt

    - name: cluster-2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: minio-storage

  replica:
    self: cluster-2
    primary: cluster-1
    source: cluster-1

  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
    pg_hba:
      - hostssl replication streaming_replica all cert
      - host all all 0.0.0.0/0 scram-sha-256

  monitoring:
    metricsQueriesTTL: 0s

  storage:
    size: 1Gi
  walStorage:
    size: 1Gi

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 512Mi
      cpu: 1
    limits:
      memory: 512Mi
      cpu: 1

  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: cnpg-cluster-external
            spec:
              type: NodePort
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432
                  nodePort: 30432
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cnpg-cluster
  podMetricsEndpoints:
    - port: metrics
      interval: 2s
      scrapeTimeout: 1s
