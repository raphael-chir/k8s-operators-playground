apiVersion: v1
kind: Secret
metadata:
  name: tde-passphrase-secret
type: Opaque
stringData:
  passphrase: "cnpg-playground-tde-passphrase"

---
apiVersion: cnpg.enterprisedb.io/v1
kind: TransparentDataEncryption
metadata:
  name: epas-tde
spec:
  keyLength: 256
  secretKeyRef:
    name: tde-passphrase-secret
    key: passphrase

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: minio-storage
spec:
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://minio.object-storage.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: minio-secret
        key: MINIO_ACCESS_KEY
      secretAccessKey:
        name: minio-secret
        key: MINIO_SECRET_KEY
    wal:
      compression: gzip

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: epas-cluster
spec:
  instances: 3

  imageName: docker.enterprisedb.com/k8s/edb-postgres-advanced:18-minimal-ubi9

  plugins:
    - name: cnpg.enterprisedb.io
      parameters:
        epas: "true"
        tdeObjectName: "epas-tde"

    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-storage

  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  replicationSlots:
    highAvailability:
      enabled: true

  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
    pg_hba:
      - host replication all all trust
      - hostssl replication all all trust
      - hostssl replication streaming_replica all cert
      - host all all 0.0.0.0/0 md5

  monitoring:
    metricsQueriesTTL: 0s

  storage:
    size: 2Gi

  walStorage:
    size: 1Gi

  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: 512Mi
      cpu: 1
    limits:
      memory: 512Mi
      cpu: 1

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: epas-cluster
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: epas-cluster
  podMetricsEndpoints:
    - port: metrics
      interval: 2s
      scrapeTimeout: 1s
