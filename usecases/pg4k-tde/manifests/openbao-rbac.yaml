apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pge-tde-openbao-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-token"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pge-tde-openbao-token-reader
subjects:
  - kind: ServiceAccount
    name: pge-tde-openbao
    namespace: default
roleRef:
  kind: Role
  name: pge-tde-openbao-token-reader
  apiGroup: rbac.authorization.k8s.io
