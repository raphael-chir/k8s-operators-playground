apiVersion: v1
kind: Pod
metadata:
  name: pgd-ha-tester
  labels:
    app: pgd-ha-tester
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: tester
      image: postgres:17
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "Starting HA test at $(date)"
          echo "--------------------------------"

          IN_DOWNTIME=0

          until psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS ha_test (date timestamp)" >/dev/null 2>&1; do
            echo "Waiting for database connectivity..."
            sleep 2
          done

          echo "Database ready. Starting continuous writes."

          while true; do
            if psql -v ON_ERROR_STOP=1 -c "INSERT INTO ha_test VALUES (now())" >/dev/null 2>&1; then
              if [ "$IN_DOWNTIME" -eq 1 ]; then
                END_TS=$(date +%s%3N)
                DIFF_MS=$((END_TS - START_TS))

                printf 'Unavailability duration: %d.%03ds\n' "$((DIFF_MS / 1000))" "$((DIFF_MS % 1000))"
                echo "Unavailability ended at $(date '+%Y-%m-%d %H:%M:%S.%3N')"
                echo "--------------------------------"

                IN_DOWNTIME=0
              fi
            else
              if [ "$IN_DOWNTIME" -eq 0 ]; then
                START_TS=$(date +%s%3N)
                echo "Unavailability started at $(date '+%Y-%m-%d %H:%M:%S.%3N')"
                IN_DOWNTIME=1
              fi
            fi

            sleep 0.01
          done
      env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: pgd-group-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pgd-group-app
              key: password
        - name: PGHOST
          value: pgd-group-proxy
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: app
        - name: PGCONNECT_TIMEOUT
          value: "1"
        - name: PGTARGETSESSIONATTRS
          value: read-write
